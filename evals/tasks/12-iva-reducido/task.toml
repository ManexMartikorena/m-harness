assert total([(1, 100.0, 'alimentacion'), (2, 10.0)]) == 120.0
assert total_con_iva([(1, 100.0)]) == 121.0
assert total_con_iva([(1, 100.0, 'alimentacion')]) == 110.0
assert total_con_iva([(2, 50.0, 'alimentacion'), (1, 100.0, 'ropa')]) == 231.0
"
'''
