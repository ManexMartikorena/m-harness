# Escribir una función contra sus tests.
instruction = "Implementa slugify en texto.py para que pasen los tests de test_texto.py, sin tocarlos."
fixture = "texto"
allow = ["write_file", "edit_file"]

[check]
# El arnés repone los tests del fixture antes de comprobar: los que toque
# el agente no cuentan (auditoría profunda, I1).
command = "python3 -m unittest -q test_texto"
