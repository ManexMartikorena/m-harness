# Arreglar un fallo con su test: leer, entender y editar.
instruction = "El test de descuentos falla. Arregla el código para que pase, sin tocar el test."
fixture = "tienda"
allow = ["write_file", "edit_file"]

[check]
# El arnés repone los tests del fixture antes de comprobar: los que toque
# el agente no cuentan (auditoría profunda, I1).
command = "PYTHONPATH=src python3 -m unittest -q tests.test_descuentos"
