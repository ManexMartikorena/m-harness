# In English: parse text, and reject what is not valid.
instruction = "Add a function parse_duration(text) to utils.py that turns durations such as '1h30m', '45s', '2h', '90m' or '1h5m10s' into a number of seconds (an int). Anything else, such as '', '10', '5x' or 'h', must raise ValueError."
fixture = "toolkit"
split = "validation"
allow = ["write_file", "edit_file"]

[check]
command = '''python3 -c "
from utils import parse_duration
assert parse_duration('1h30m') == 5400
assert parse_duration('45s') == 45
assert parse_duration('2h') == 7200
assert parse_duration('90m') == 5400
assert parse_duration('1h5m10s') == 3910
for bad in ['', '10', '5x', 'h']:
    try:
        parse_duration(bad)
    except ValueError:
        continue
    raise AssertionError(repr(bad))
"'''
