# Encontrar la causa real de varios tests que fallan.
instruction = "Los tests de la agenda fallan. Encuentra la causa y arréglala sin tocar los tests."
fixture = "agenda"
allow = ["write_file", "edit_file"]

[check]
# El arnés repone los tests del fixture antes de comprobar: los que toque
# el agente no cuentan (auditoría profunda, I1).
command = "python3 -m unittest -q test_calendario"
