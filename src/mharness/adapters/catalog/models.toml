# Prices and context windows of the models of each provider (spec hito 7,
# §1.3). USD per million tokens. `maha` reads it at start-up; the user's
# ~/.config/maha/models.toml, same format, wins model by model.
#
# Prices: from each provider's docs, on the date in `checked`. Context
# windows: from models.dev (https://models.dev/api.json), the same day.
# A price that depends on the hour takes the higher one; a temporary
# discount, the price billed today, with its end in a comment. Updating
# this file is a PR that checks the docs again (AGENTS.md, external facts).

[providers.opencode-go]
checked = 2026-10-27
source = "https://opencode.ai/docs/go/"

[providers.opencode-zen]
checked = 2026-10-27
source = "https://opencode.ai/docs/zen/"

